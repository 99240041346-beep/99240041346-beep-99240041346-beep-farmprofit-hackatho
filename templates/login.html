{% extends "base.html" %}
{% block title %}Login — FarmProfit{% endblock %}
{% block public_content %}
<div class="auth-page">
  <div class="auth-brand"><a class="brand dark" href="{{ url_for('index') }}"><span class="brand-mark">🌾</span><span>FarmProfit</span></a></div>
  <div class="auth-card">
    <div class="auth-icon">🌱</div><h1>Welcome back</h1><p>Log in to continue your farm profitability analysis.</p>
    <form method="post" class="auth-form">
      <label>Email<input type="email" name="email" autocomplete="email" placeholder="you@example.com" required></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" placeholder="••••••••" required></label>
      <button class="btn btn-primary full btn-large" type="submit">Log in</button>
    </form>
    <div class="demo-box"><strong>Demo account</strong><span>Email: demo@farmprofit.app</span><span>Password: Demo@12345</span></div>
    <p class="auth-switch">New to FarmProfit? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
