{% extends "base.html" %}
{% block title %}Create Account — FarmProfit{% endblock %}
{% block public_content %}
<div class="auth-page">
  <div class="auth-brand"><a class="brand dark" href="{{ url_for('index') }}"><span class="brand-mark">🌾</span><span>FarmProfit</span></a></div>
  <div class="auth-card">
    <div class="auth-icon">👨‍🌾</div><h1>Create your farmer account</h1><p>Save farm plans and compare profitability over time.</p>
    <form method="post" class="auth-form">
      <label>Full name<input type="text" name="name" autocomplete="name" placeholder="Your name" required></label>
      <label>Email<input type="email" name="email" autocomplete="email" placeholder="you@example.com" required></label>
      <label>Password<input type="password" name="password" autocomplete="new-password" placeholder="Minimum 6 characters" minlength="6" required></label>
      <label>Confirm password<input type="password" name="confirm_password" autocomplete="new-password" placeholder="Repeat password" minlength="6" required></label>
      <button class="btn btn-primary full btn-large" type="submit">Create account</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
